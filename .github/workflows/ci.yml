name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Unit and synthetic integration tests
        run: python -m unittest discover -s tests -v
      - name: Validate public artifacts
        run: python -m adipose_senescence_ifn.cli validate-repository --root .

